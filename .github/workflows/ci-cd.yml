name: CI/CD Pipeline & GitHub Packages (GHCR)

on:
  push:
    branches: [ "main", "Feature*", "Feature1Architecture", "Feature2IAEngine", "Feature3Gui" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  # -------------------------------------------------------------
  # 1. PRUEBAS Y LINTING DE LA API DE DATOS (FASTAPI)
  # -------------------------------------------------------------
  test-api:
    name: 🧪 API Data Service Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt
          pip install httpx

      - name: Ejecutar Pruebas Automatizadas API
        run: |
          cd api
          python test_api.py

  # -------------------------------------------------------------
  # 2. PRUEBAS Y LINTING DEL ORQUESTADOR SRE (OPENCLAW)
  # -------------------------------------------------------------
  test-agent-engine:
    name: ⚙️ SRE Agent Engine Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar Dependencias SRE
        run: |
          python -m pip install --upgrade pip
          pip install -r agent_engine/requirements.txt
          pip install httpx

      - name: Ejecutar Pruebas SRE de Aprovisionamiento
        run: |
          cd agent_engine
          python test_provisioning.py

  # -------------------------------------------------------------
  # 3. COMPILACIÓN Y VALIDACIÓN DEL FRONTEND (REACT + VITE)
  # -------------------------------------------------------------
  build-frontend:
    name: 🎨 Build React + Tailwind Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar Dependencias Frontend
        run: |
          cd frontend
          npm ci

      - name: Compilar Frontend para Producción
        run: |
          cd frontend
          npm run build

  # -------------------------------------------------------------
  # 4. VALIDACIÓN DE INFRAESTRUCTURA (TERRAFORM)
  # -------------------------------------------------------------
  validate-terraform:
    name: ☁️ Terraform Format & Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.7"

      - name: Validar Sintaxis e Formato Terraform
        run: |
          cd terraform
          terraform init -backend=false
          terraform fmt -check
          terraform validate

  # -------------------------------------------------------------
  # 5. PUBLICACIÓN DE PAQUETES DOCKER EN GITHUB PACKAGES (GHCR)
  # -------------------------------------------------------------
  publish-packages:
    name: 📦 Publish Docker Images to GHCR
    needs: [test-api, test-agent-engine, build-frontend, validate-terraform]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/Feature'))
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Iniciar Sesión en GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y Publicar Imagen Docker de Data API
        uses: docker/build-push-action@v5
        with:
          context: ./api
          file: ./api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/realstateaux-api:latest
            ghcr.io/${{ github.repository_owner }}/realstateaux-api:${{ github.sha }}

      - name: Construir y Publicar Imagen Docker de OpenClaw Agent
        uses: docker/build-push-action@v5
        with:
          context: ./agent_engine/mock_openclaw
          file: ./agent_engine/mock_openclaw/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/realstateaux-openclaw:latest
            ghcr.io/${{ github.repository_owner }}/realstateaux-openclaw:${{ github.sha }}
